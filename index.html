<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>觉醒 · 自律系统</title>

  <meta name="theme-color" content="#0b0b0f">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 20px 40px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 38px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .day {
      font-size: 12px;
      color: #777;
      letter-spacing: 1px;
    }

    .quote {
      text-align: center;
      margin-bottom: 35px;
    }

    .quote-small {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .quote-main {
      font-size: 21px;
      line-height: 1.6;
      font-weight: 600;
    }

    .score {
      background: #141419;
      border: 1px solid #24242b;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      margin-bottom: 20px;
    }

    .score-title {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .score-number {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 15px;
    }

    .progress {
      height: 5px;
      background: #292930;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 72%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
    }

    .tasks {
      background: #141419;
      border: 1px solid #24242b;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .tasks-title {
      font-size: 15px;
      margin-bottom: 16px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #222228;
    }

    .task:last-child {
      border-bottom: none;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 1px solid #555;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .checkbox.done {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .task-text {
      font-size: 14px;
      flex: 1;
    }

    .task-points {
      color: #666;
      font-size: 12px;
    }

    .focus-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .focus-btn:active {
      transform: scale(0.97);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 28px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">觉醒</div>
    <div class="day">DAY 01 / 30</div>
  </div>

  <div class="quote">
    <div class="quote-small">TODAY'S QUESTION</div>

    <div class="quote-main">
      今天，你准备成为<br>
      怎样的人？
    </div>
  </div>

  <div class="score">

    <div class="score-title">
      今日自律值
    </div>

    <div class="score-number" id="score">
      72
    </div>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>

  </div>

  <div class="tasks">

    <div class="tasks-title">
      今日任务
    </div>

    <div class="task">
      <div class="checkbox done" onclick="completeTask(this)">
        ✓
      </div>

      <div class="task-text">
        运动 30 分钟
      </div>

      <div class="task-points">
        +20
      </div>
    </div>

    <div class="task">
      <div class="checkbox done" onclick="completeTask(this)">
        ✓
      </div>

      <div class="task-text">
        学习 60 分钟
      </div>

      <div class="task-points">
        +20
      </div>
    </div>

    <div class="task">
      <div class="checkbox" onclick="completeTask(this)">
      </div>

      <div class="task-text">
        阅读 20 分钟
      </div>

      <div class="task-points">
        +20
      </div>
    </div>

    <div class="task">
      <div class="checkbox" onclick="completeTask(this)">
      </div>

      <div class="task-text">
        23:30 前睡觉
      </div>

      <div class="task-points">
        +20
      </div>
    </div>

  </div>

  <button class="focus-btn" onclick="startFocus()">
    开始专注
  </button>

  <div class="footer">
    CONTROL YOURSELF · CHANGE YOUR LIFE
  </div>

</div>

<script>

function completeTask(element) {

  element.classList.toggle("done");

  if (element.classList.contains("done")) {
    element.innerHTML = "✓";
  } else {
    element.innerHTML = "";
  }

  updateScore();
}

function updateScore() {

  const tasks = document.querySelectorAll(".checkbox");

  let completed = 0;

  tasks.forEach(task => {
    if (task.classList.contains("done")) {
      completed++;
    }
  });

  const score = completed * 20;

  document.getElementById("score").innerText = score;

  document.getElementById("progress").style.width =
    score + "%";
}

function startFocus() {

  alert(
    "专注模式即将上线。\n\n" +
    "下一版本我们会加入真正的专注计时器。"
  );

}

</script>

</body>
</html>
